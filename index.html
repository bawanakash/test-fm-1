<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bawan's Global Live Station</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: rgba(17, 25, 40, 0.75);
            --accent-glow: #3b82f6;
            --accent-neon: #00f2fe;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #050b14 100%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Sleek Glassmorphism App Container */
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 5px 0;
            background: linear-gradient(to right, #fff, var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        p.subtitle { color: var(--accent-glow); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 20px 0; }
        h3 { margin: 0 0 12px 0; color: #fff; font-weight: 600; font-size: 15px; text-align: left;}
        
        /* Premium Player Box */
        .media-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 18px;
            margin: 15px 0;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 1px solid rgba(0, 242, 254, 0.1);
            position: relative;
        }

        audio, video { 
            width: 100%; 
            max-height: 220px; 
            border-radius: 12px; 
            margin-top: 15px;
            outline: none;
        }
        
        /* Modern Inputs */
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus { border-color: var(--accent-neon); outline: none; background: rgba(0, 0, 0, 0.5); }
        
        /* High-Converting Buttons */
        button {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            border: none;
            color: #050b14;
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-glow));
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active { transform: scale(0.97); }

        /* Custom Mobile Tune-In Button */
        #tuneInBtn { background: #10b981; color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .admin-section { border-top: 1px solid rgba(255, 255, 255, 0.05); margin-top: 20px; padding-top: 20px; width: 100%; max-width: 450px; }
        .hidden { display: none !important; }
        .success-text { color: #10b981; font-size: 13px; font-weight: 600; }
        
        /* Chat Box styling */
        .chat-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; height: 150px; overflow-y: auto; text-align: left; font-size: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .chat-msg { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; color: #e2e8f0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📻 BAWAN'S STATION</h1>
        <p class="subtitle">Global Live Broadcast</p>

        <button id="tuneInBtn">🎧 Tap Here to Tune In</button>

        <div class="media-box hidden" id="mediaContainer">
            <div id="playingAnimation" class="hidden" style="color: var(--accent-neon); font-size: 24px; margin-bottom: 10px;">ılıılıılı</div>
            <p id="trackNameDisplay" style="font-weight: 700; color: #fff; margin: 0; font-size: 15px; word-break: break-all;">Waiting for stream...</p>
            <div id="playerRoot" style="width: 100%;"></div>
        </div>

        <div style="margin-top: 25px; text-align: left;">
            <h3>Send a Request / Say Hi</h3>
            <textarea id="userSuggestion" placeholder="Type a message..." rows="2"></textarea>
            <button id="submitSuggestBtn" type="button" style="background: rgba(255,255,255,0.1); color: #fff; box-shadow: none;">Send Message 🚀</button>
            <p id="successMsg" class="success-text hidden">✓ Message sent to studio!</p>
        </div>
    </div>

    <div class="admin-section">
        <div id="adminLoginGate" class="container" style="background: rgba(0,0,0,0.4); border:none;">
            <h3 style="text-align: center;">Studio Access</h3>
            <input type="password" id="adminPassInput" placeholder="Enter Password (0135)">
            <button id="loginBtn" type="button" style="background: #334155; color: white; box-shadow:none;">Login</button>
        </div>

        <div id="bawanControlPanel" class="container hidden" style="border: 1px solid var(--accent-glow);">
            <h2 style="margin-top:0; color:#fff; font-size:20px; text-align: center;">👑 Studio Console</h2>
            
            <div style="text-align: left; margin-top: 20px;">
                <label style="font-size:13px; font-weight:700; color: var(--accent-neon); text-transform: uppercase;">Broadcast New Track:</label>
                <input type="file" id="mediaUpload" accept="audio/*, video/*" style="padding: 10px; margin-top:8px;">
                <p id="uploadStatus" class="hidden" style="font-size:13px; margin: 8px 0 0 0; color: #f59e0b; font-weight:bold;"></p>
            </div>

            <div style="margin-top: 25px;">
                <label style="font-size:13px; font-weight:700; color: var(--text-dim); text-transform: uppercase;">Live Listener Inbox:</label>
                <div id="adminInbox" class="chat-box" style="margin-top: 8px;">
                    <p style="color: var(--text-dim); text-align:center;">No messages yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://nwyvennvjugzsdamqrug.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_qHQLQ1YPmDwweggO0mWNPw_piFdvS8R";

        const tuneInBtn = document.getElementById('tuneInBtn');
        const mediaContainer = document.getElementById('mediaContainer');
        const playerRoot = document.getElementById('playerRoot');
        const trackNameDisplay = document.getElementById('trackNameDisplay');
        const playingAnimation = document.getElementById('playingAnimation');
        
        let currentActiveUrl = "";
        let isListening = false; // Prevents mobile from fetching until user taps play

        // --- 1. MOBILE TUNE IN LOGIC ---
        tuneInBtn.addEventListener('click', () => {
            isListening = true;
            tuneInBtn.classList.add('hidden');
            mediaContainer.classList.remove('hidden');
            syncGlobalStream(); // Start fetching the song immediately
        });

        // --- 2. STREAM SYNC LOGIC ---
        async function syncGlobalStream() {
            if (!isListening) return; // Don't run until mobile user taps the button

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/live_station?select=*&order=id.desc&limit=1`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                
                if (data && data.length > 0) {
                    const latestTrack = data[0];
                    
                    if (currentActiveUrl !== latestTrack.current_track_u) {
                        currentActiveUrl = latestTrack.current_track_u;
                        trackNameDisplay.textContent = latestTrack.track_name;
                        playingAnimation.classList.remove('hidden');
                        
                        const element = document.createElement(latestTrack.media_type === 'video' ? 'video' : 'audio');
                        element.src = latestTrack.current_track_u;
                        element.controls = true;
                        element.setAttribute('playsinline', 'true'); // Required for iOS Video
                        
                        playerRoot.innerHTML = '';
                        playerRoot.appendChild(element);
                        
                        // Mobile will now allow this because the user already tapped the Tune In button!
                        element.play().catch(e => console.log("Buffering..."));
                    }
                }
            } catch (err) { console.error(err); }
        }

        // --- 3. GLOBAL CHAT / REQUESTS LOGIC ---
        document.getElementById('submitSuggestBtn').addEventListener('click', async () => {
            const val = document.getElementById('userSuggestion').value.trim();
            if(!val) return;

            // Send to Supabase 'requests' table
            await fetch(`${SUPABASE_URL}/rest/v1/requests`, {
                method: 'POST',
                headers: { "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ message: val })
            });
            
            document.getElementById('userSuggestion').value = '';
            document.getElementById('successMsg').classList.remove('hidden');
            setTimeout(() => document.getElementById('successMsg').classList.add('hidden'), 3000);
        });

        // --- 4. ADMIN PANEL CHAT INBOX LOGIC ---
        async function fetchAdminInbox() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/requests?select=*&order=id.desc&limit=20`, {
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                });
                const data = await res.json();
                
                if (data && data.length > 0) {
                    const inbox = document.getElementById('adminInbox');
                    inbox.innerHTML = '';
                    data.forEach(req => {
                        inbox.innerHTML += `<div class="chat-msg">💬 ${req.message}</div>`;
                    });
                }
            } catch(e) {}
        }

        // --- 5. ADMIN UPLOAD LOGIC ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            if (document.getElementById('adminPassInput').value.trim() === "0135") {
                document.getElementById('adminLoginGate').classList.add('hidden');
                document.getElementById('bawanControlPanel').classList.remove('hidden');
                fetchAdminInbox(); // Load messages when admin logs in
                setInterval(fetchAdminInbox, 5000); // Check for new messages every 5 seconds
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        document.getElementById('mediaUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.textContent = "Uploading to Cloud... Please wait.";
            uploadStatus.classList.remove('hidden');

            const uniqueName = Date.now() + "_" + file.name.replace(/\s+/g, '_');
            const uploadUrl = `${SUPABASE_URL}/storage/v1/object/radio/${uniqueName}`;

            try {
                const storageRes = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: { "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY, "Content-Type": file.type },
                    body: file
                });

                if (storageRes.ok) {
                    const publicFileUrl = `${SUPABASE_URL}/storage/v1/object/public/radio/${uniqueName}`;
                    const trackType = file.type.startsWith('video') ? 'video' : 'audio';

                    await fetch(`${SUPABASE_URL}/rest/v1/live_station`, {
                        method: 'POST',
                        headers: { "Authorization": `Bearer ${SUPABASE_KEY}`, "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
                        body: JSON.stringify({ current_track_u: publicFileUrl, track_name: file.name, media_type: trackType })
                    });

                    uploadStatus.textContent = "✓ Live stream updated globally!";
                    uploadStatus.style.color = "#10b981";
                    syncGlobalStream();
                }
            } catch (err) { uploadStatus.textContent = "Upload failed."; }
        });

        // Check for new songs every 4 seconds
        setInterval(syncGlobalStream, 4000);
    </script>
</body>
</html>
