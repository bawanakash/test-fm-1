<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bawan's Global Live Station</title>
    <style>
        /* --- ULTRA FAST STYLING --- */
        * { box-sizing: border-box; }
        
        body {
            /* Uses the phone's native font - Zero download time */
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            background-color: #0f172a; /* Solid dark color, instantly loads */
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h2, h3 { margin-top: 0; font-weight: 600; color: #38bdf8; }
        h3 { border-bottom: 1px solid #334155; padding-bottom: 10px; }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: white; font-size: 16px;
        }

        input:focus { outline: none; border-color: #38bdf8; }

        button {
            width: 100%; padding: 14px; margin-top: 10px;
            background: #0ea5e9; color: white; border: none;
            border-radius: 8px; font-weight: bold; font-size: 16px;
            cursor: pointer;
        }

        button:active { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* --- LAYOUT --- */
        #entry-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex;
            justify-content: center; align-items: center; z-index: 100;
        }
        
        .popup-content { width: 90%; max-width: 350px; text-align: center; }

        #main-app {
            display: none; width: 95%; max-width: 900px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        /* --- CHAT --- */
        #chat-box {
            height: 300px; overflow-y: auto; background: #0f172a;
            border-radius: 8px; padding: 15px; margin-bottom: 10px;
        }
        .message { margin-bottom: 12px; font-size: 14px; }
        .message .sender { font-weight: bold; color: #38bdf8; }
        .admin-msg { background: #451a03; padding: 8px; border-left: 4px solid #f59e0b; }
        .admin-msg .sender { color: #f59e0b; }
        .admin-badge { background: #f59e0b; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="entry-popup">
        <div class="panel popup-content">
            <h2>Bawan Radio</h2>
            <p style="color: #94a3b8; font-size: 14px;">Enter your name to connect</p>
            <input type="text" id="listener-name" placeholder="Display Name..." required>
            <button id="tune-btn" onclick="tuneIn()">Tune In Live</button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <h2 style="text-align: center; margin-bottom: 20px;">Welcome, <span id="display-name" style="color: white;"></span>!</h2>
        
        <div class="grid">
            <div class="panel">
                <h3>Live Chat</h3>
                <div id="chat-box"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="chat-input" placeholder="Message...">
                    <button onclick="sendChatMessage()" style="width: 80px; margin: 10px 0;">Send</button>
                </div>
            </div>

            <div class="panel">
                <h3>Studio Console</h3>
                <div id="admin-login">
                    <input type="password" id="admin-password" placeholder="Admin Key">
                    <button onclick="loginAdmin()" style="background: #e11d48;">Unlock</button>
                </div>
                <div id="admin-controls" class="hidden" style="text-align: center; padding-top: 20px;">
                    <p style="color: #38bdf8; font-weight: bold;">Console Unlocked</p>
                    <p style="color: #94a3b8; font-size: 14px;">Ready to broadcast.</p>
                </div>
            </div>
        </div>
    </div>

    <audio id="station-audio" preload="none">
        <source src="YOUR_AUDIO_LINK_HERE.mp3" type="audio/mpeg">
    </audio>

    <script>
        let currentUser = "";
        let isAdmin = false;

        function tuneIn() {
            const nameInput = document.getElementById("listener-name").value.trim();
            if (nameInput === "") {
                alert("Please enter a name!"); return;
            }

            // 1. Change button to show it is loading
            const btn = document.getElementById("tune-btn");
            btn.innerText = "Connecting to Studio...";
            btn.disabled = true;

            currentUser = nameInput;
            document.getElementById("display-name").innerText = currentUser;

            // 2. Try to play audio
            const audio = document.getElementById("station-audio");
            audio.volume = 0.5;
            
            // Use a Promise to wait for the audio to actually start fetching
            audio.play().then(() => {
                // Once audio starts, switch the screens
                document.getElementById("entry-popup").style.display = "none";
                document.getElementById("main-app").classList.remove("hidden");
            }).catch(e => {
                console.log("Audio load error/delay:", e);
                // If it fails (or is just slow), force the screen to switch anyway so the user isn't stuck
                document.getElementById("entry-popup").style.display = "none";
                document.getElementById("main-app").classList.remove("hidden");
            });
        }

        function loginAdmin() {
            const pass = document.getElementById("admin-password").value;
            if (pass === "secret123") { 
                isAdmin = true;
                currentUser = "Studio Host"; 
                document.getElementById("admin-login").classList.add("hidden");
                document.getElementById("admin-controls").classList.remove("hidden");
            } else {
                alert("Incorrect password.");
            }
        }

        function sendChatMessage() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (text === "") return;

            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");

            if (isAdmin) {
                msgDiv.classList.add("admin-msg");
                msgDiv.innerHTML = `<span class="sender">${currentUser} <span class="admin-badge">HOST</span></span>: ${text}`;
            } else {
                msgDiv.innerHTML = `<span class="sender">${currentUser}</span>: ${text}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = "";
        }
    </script>
</body>
</html>
